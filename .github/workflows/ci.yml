
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore YOMI-Lite.slnx

      - name: Build
        run: dotnet build YOMI-Lite.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test YOMI-Lite.slnx --configuration Release --no-build
